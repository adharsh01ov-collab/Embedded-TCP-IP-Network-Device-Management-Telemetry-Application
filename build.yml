name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc make

      - name: Build server and device
        run: make all

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            server/server.exe
            device/device.exe
